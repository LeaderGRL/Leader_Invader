name: capture-frontpage

on:
  workflow_dispatch:
  push:
    branches:
      - feat/deterministic-svg-engine
    paths:
      - 'generated/Leader.svg'
      - 'scripts/capture_frontpage.mjs'
      - '.github/workflows/capture-frontpage.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Capture the exact committed production SVG, including t=0.
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium

      - name: Capture production SVG checkpoints
        run: node scripts/capture_frontpage.mjs

      - name: Verify captures
        run: |
          test -f generated/frontpage-captures/01-power-on-full-die.png
          test -f generated/frontpage-captures/02-native-bus-propagation.png
          test -f generated/frontpage-captures/03-ripple-alu-propagation.png
          test -f generated/frontpage-captures/04-exact-memory-cell.png
          test -f generated/frontpage-captures/05-native-crt-gameplay.png
          test -f generated/frontpage-captures/manifest.json
          ls -lh generated/frontpage-captures

      - name: Upload frontpage checkpoints
        uses: actions/upload-artifact@v4
        with:
          name: leader-physical-die-checkpoints-${{ github.sha }}
          path: generated/frontpage-captures/
          retention-days: 30
          if-no-files-found: error
