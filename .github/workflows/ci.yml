name: ci

on:
  pull_request:
    paths-ignore:
      - 'generated/**'
  push:
    paths-ignore:
      - 'generated/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Normalize formatting in CI workspace
        run: cargo fmt --all
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Generate smoke artifact
        run: cargo run -p leader-cli -- render --seed ci-smoke --output /tmp/Leader.svg
      - name: Validate SVG
        run: python scripts/validate_svg.py /tmp/Leader.svg
