name: render-readme

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Optional deterministic seed (defaults to commit SHA)
        required: false
        type: string
  push:
    paths-ignore:
      - 'generated/**'

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Choose seed
        id: seed
        shell: bash
        run: |
          if [ -n "${{ inputs.seed }}" ]; then
            echo "value=${{ inputs.seed }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate deterministic replay
        run: cargo run --release -p leader-cli -- render --seed "${{ steps.seed.outputs.value }}" --output generated/Leader.svg
      - name: Validate SVG structure
        run: python scripts/validate_svg.py generated/Leader.svg
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install visual validator
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Validate visual checkpoints
        run: node scripts/capture_frontpage.mjs
      - name: Upload frontpage checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leader-frontpage-checkpoints-${{ github.sha }}
          path: generated/frontpage-captures/
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve full execution trace
        uses: actions/upload-artifact@v4
        with:
          name: leader-trace-${{ github.sha }}
          path: generated/trace.json
          retention-days: 14
          if-no-files-found: error
      - name: Commit generated SVG
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- generated/Leader.svg)" ]; then
            echo "generated SVG is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/Leader.svg
          git commit -m "chore(render): refresh deterministic README replay"
          git push
